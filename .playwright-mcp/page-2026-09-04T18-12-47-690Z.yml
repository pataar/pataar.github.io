                - generic [aria-hidden] [ref=f5e78]: :e work.md
            - paragraph [ref=f5e80]:
                - text: I'm tech lead on the
                - link "Patient Journey App" [ref=f5e81] [cursor=pointer]:
                    - /url: https://www.patientjourneyapp.com
                - text: at
                - link "Interactive Studios" [ref=f5e82] [cursor=pointer]:
                    - /url: https://www.interactivestudios.nl
                - text: ", an app that guides patients through their treatment by giving them the right information at exactly the right moment. My work runs the whole stack: application architecture, code review, CI/CD, and keeping our Kubernetes clusters happy. I've been writing code since I was 14, and part of Interactive Studios since 2012."
        - generic [ref=f5e83]:
            - heading "technologies" [level=2] [ref=f5e84]:
                - generic [aria-hidden] [ref=f5e85]: "##"
                - text: technologies
                - generic [aria-hidden] [ref=f5e86]: :e stack.md
            - paragraph [ref=f5e88]:
                - text: Laravel on the backend, React and TypeScript on the frontend, React Native + Expo on mobile, and Kubernetes underneath it all. Lately I've been poking at
                - link "Rust" [ref=f5e89] [cursor=pointer]:
                    - /url: https://www.rust-lang.org
                - text: ", mostly for fun and sometimes for speed. Open source is close to my heart, as an idea and in practice: I contribute where I can and want to do more of it. See"
                - link "projects" [ref=f5e90] [cursor=pointer]:
                    - /url: /projects/
                - text: for the results.
        - generic [ref=f5e91]:
            - heading "homelab" [level=2] [ref=f5e92]:
                - generic [aria-hidden] [ref=f5e93]: "##"
                - text: homelab
                - generic [aria-hidden] [ref=f5e94]: :e homelab.md
            - generic [ref=f5e95]:
                - paragraph [ref=f5e96]: "The most over-engineered corner of the house: a dedicated Proxmox box that runs Home Assistant, an Unraid server hosting Immich, Paperless-ngx, Syncthing, and more containers than strictly necessary (protected by a parity disk, whatever RAID level that makes it), and a UniFi network tying it all together."
                - paragraph [ref=f5e97]: "The 3D printers count as lab equipment too: a Bambu Lab P1S and a heavily modded Ender 3 running Klipper and Mainsail. Tinkering with it all is half the point; the other half is that the lights turn on by themselves."
        - generic [ref=f5e98]:
            - heading "outside of work" [level=2] [ref=f5e99]:
                - generic [aria-hidden] [ref=f5e100]: "##"
                - text: outside of work
                - generic [aria-hidden] [ref=f5e101]: :e life.md
            - generic [ref=f5e102]:
                - paragraph [ref=f5e103]: When I'm not at a keyboard, I'm with my partner, our two kids, and the dog. The rest of my time goes to drumming, collecting vinyl, 3D printing, gaming, and evenings with friends.
                - paragraph [ref=f5e104]: The drumming happens on an acoustic kit when the house allows it and an e-kit when it doesn't, to a soundtrack of Drum 'n Bass, deadmau5, rock, metal, metalcore, and much more.
                - paragraph [ref=f5e105]: "Big sci-fi and fantasy fan, on screen and on paper: Star Wars, Lord of the Rings, and Brandon Sanderson's Mistborn series."
                - paragraph [ref=f5e106]: "Also: astronomy and physics. I will happily lose an evening to a video about black holes."
