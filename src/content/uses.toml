[os]
order = 1
items = [
	{ description = "Arch-based and fast, my daily driver", icon = "simple-icons:cachyos", name = "cachyos", url = "https://cachyos.org" },
]

[terminal]
order = 2
items = [
	{ description = "GPU-accelerated terminal emulator", icon = "simple-icons:ghostty", name = "ghostty", url = "https://ghostty.org" },
	{ description = "cross-shell prompt", icon = "simple-icons:starship", name = "starship", url = "https://starship.rs" },
	{ description = "a smarter cd", icon = "lucide:folder-symlink", name = "zoxide", url = "https://github.com/ajeetdsouza/zoxide" },
	{ description = "fuzzy finder for everything", icon = "lucide:text-search", name = "fzf", url = "https://github.com/junegunn/fzf" },
	{ description = "git TUI that makes rebasing bearable", icon = "lucide:git-merge", name = "lazygit", url = "https://github.com/jesseduffield/lazygit" },
	{ description = "one version manager for every runtime", icon = "lucide:wrench", name = "mise", url = "https://mise.jdx.dev" },
]

[editors]
order = 3
items = [
	{ description = "fast, my main editor", icon = "simple-icons:zedindustries", name = "zed", url = "https://zed.dev" },
	{ description = "when the project calls for a full IDE", icon = "simple-icons:jetbrains", name = "jetbrains", url = "https://www.jetbrains.com" },
]

[agents]
order = 4
items = [
	{ description = "AI pair programmer that lives in the terminal", icon = "simple-icons:claudecode", name = "claude-code", url = "https://claude.com/product/claude-code" },
	{ description = "tmux for coding agents, keeps the fleet in line", icon = "lucide:bot", name = "herdr", url = "https://github.com/herdrdev/herdr" },
]

[apps]
order = 5
items = [
	{ description = "browser without the ads", icon = "simple-icons:brave", name = "brave", url = "https://brave.com" },
	{ description = "notes, linked and local", icon = "simple-icons:obsidian", name = "obsidian", url = "https://obsidian.md" },
	{ description = "todos and reminders", icon = "simple-icons:ticktick", name = "ticktick", url = "https://ticktick.com" },
]
