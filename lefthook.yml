pre-commit:
  commands:
    format:
      glob: "*.{cjs,cts,js,json,jsonc,jsx,md,mjs,mts,ts,tsx,yaml,yml}"
      run: bun oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{astro,cjs,cts,js,jsx,mjs,mts,svelte,ts,tsx,vue}"
      run: bun oxlint --fix {staged_files}
      stage_fixed: true
